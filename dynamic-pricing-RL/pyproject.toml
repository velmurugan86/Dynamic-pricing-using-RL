[project]
name = "dynamic-pricing"
version = "0.1.0"
description = "Gymnasium environment for dynamic product pricing simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "gymnasium>=0.29",
    "numpy>=1.26",
    "pandas>=2.3.3",
    "pyyaml>=6.0",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_pricing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
